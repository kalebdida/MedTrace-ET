AWSTemplateFormatVersion: '2010-09-09'
Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
      - sts.amazonaws.com
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated:
              Ref: GitHubProvider
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
              token.actions.githubusercontent.com:sub: repo:kalebdida/MedTrace-ET:ref:refs/heads/main
      Policies:
      - PolicyName: SamDeployment
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cloudformation:CreateChangeSet
            - cloudformation:DescribeChangeSet
            - cloudformation:ExecuteChangeSet
            - cloudformation:DeleteChangeSet
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            - cloudformation:GetTemplate
            - cloudformation:GetTemplateSummary
            - cloudformation:CreateStack
            - cloudformation:UpdateStack
            - cloudformation:DeleteStack
            - cloudformation:ListStackResources
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medtrace-et/*
            - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-*/*
          - Effect: Allow
            Action:
            - cloudformation:ValidateTemplate
            - ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - lambda:CreateFunction
            - lambda:DeleteFunction
            - lambda:GetFunction
            - lambda:GetFunctionConfiguration
            - lambda:UpdateFunctionCode
            - lambda:UpdateFunctionConfiguration
            - lambda:AddPermission
            - lambda:RemovePermission
            - lambda:GetPolicy
            - lambda:TagResource
            - lambda:UntagResource
            - lambda:ListTags
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:medtrace-et-*
          - Effect: Allow
            Action:
            - dynamodb:CreateTable
            - dynamodb:DeleteTable
            - dynamodb:DescribeTable
            - dynamodb:UpdateTable
            - dynamodb:TagResource
            - dynamodb:UntagResource
            - dynamodb:ListTagsOfResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medtrace-et-*
          - Effect: Allow
            Action:
            - sns:CreateTopic
            - sns:DeleteTopic
            - sns:GetTopicAttributes
            - sns:SetTopicAttributes
            - sns:Subscribe
            - sns:Unsubscribe
            - sns:GetSubscriptionAttributes
            - sns:SetSubscriptionAttributes
            - sns:ListSubscriptionsByTopic
            - sns:TagResource
            - sns:UntagResource
            - sns:ListTagsForResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:medtrace-et-*
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:DeleteLogGroup
            - logs:PutRetentionPolicy
            - logs:DeleteRetentionPolicy
            - logs:DescribeLogGroups
            - logs:TagResource
            - logs:UntagResource
            - logs:ListTagsForResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medtrace-et-*
          - Effect: Allow
            Action:
            - ecr:CreateRepository
            - ecr:DeleteRepository
            - ecr:DescribeRepositories
            - ecr:GetRepositoryPolicy
            - ecr:SetRepositoryPolicy
            - ecr:DeleteRepositoryPolicy
            - ecr:PutLifecyclePolicy
            - ecr:GetLifecyclePolicy
            - ecr:TagResource
            - ecr:UntagResource
            - ecr:ListTagsForResource
            - ecr:BatchCheckLayerAvailability
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/medtraceet*
          - Effect: Allow
            Action:
            - s3:CreateBucket
            - s3:DeleteBucket
            - s3:GetBucketLocation
            - s3:GetBucketPolicy
            - s3:PutBucketPolicy
            - s3:PutBucketPublicAccessBlock
            - s3:PutEncryptionConfiguration
            - s3:GetEncryptionConfiguration
            - s3:PutBucketVersioning
            - s3:GetBucketVersioning
            - s3:ListBucket
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*
            - Fn::Sub: arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*/*
          - Effect: Allow
            Action:
            - iam:CreateRole
            - iam:DeleteRole
            - iam:GetRole
            - iam:PutRolePolicy
            - iam:DeleteRolePolicy
            - iam:GetRolePolicy
            - iam:AttachRolePolicy
            - iam:DetachRolePolicy
            - iam:TagRole
            - iam:UntagRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/medtrace-et-*
          - Effect: Allow
            Action: iam:PassRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/medtrace-et-*
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Effect: Allow
            Action:
            - apigateway:GET
            - apigateway:POST
            - apigateway:PUT
            - apigateway:PATCH
            - apigateway:DELETE
            Resource:
              Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*
          - Effect: Allow
            Action:
            - cognito-idp:CreateUserPool
            - cognito-idp:DeleteUserPool
            - cognito-idp:DescribeUserPool
            - cognito-idp:UpdateUserPool
            - cognito-idp:CreateUserPoolClient
            - cognito-idp:DeleteUserPoolClient
            - cognito-idp:DescribeUserPoolClient
            - cognito-idp:UpdateUserPoolClient
            - cognito-idp:SetUserPoolMfaConfig
            - cognito-idp:TagResource
            - cognito-idp:UntagResource
            - cognito-idp:ListTagsForResource
            Resource: '*'
          - Effect: Allow
            Action:
            - cloudwatch:PutMetricAlarm
            - cloudwatch:DeleteAlarms
            - cloudwatch:DescribeAlarms
            - cloudwatch:PutDashboard
            - cloudwatch:GetDashboard
            - cloudwatch:DeleteDashboards
            - cloudwatch:TagResource
            - cloudwatch:UntagResource
            Resource: '*'
          - Effect: Allow
            Action:
            - budgets:ModifyBudget
            - budgets:ViewBudget
            Resource:
              Fn::Sub: arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/medtrace-et-*
Outputs:
  DeployRoleArn:
    Value:
      Fn::GetAtt:
      - DeployRole
      - Arn
