name: Live check
# Every 10 minutes: keeps the free Render backend awake and checks the live
# system. GitHub emails the repository owner when a run fails.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      adama_email:
        description: "Pharmacy account in Adama (for the full clone demo)"
        required: false
      adama_password:
        description: "Its password"
        required: false
      dessie_email:
        description: "Pharmacy account in Dessie"
        required: false
      dessie_password:
        description: "Its password"
        required: false
      inspector_password:
        description: "Password of inspector@medtrace.demo (checks the alerts list)"
        required: false
permissions:
  contents: read
concurrency:
  group: live-check
  cancel-in-progress: false
env:
  API_URL: https://medtrace-et.onrender.com
  APP_URL: https://medtrace-app.onrender.com
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Health (waits for a cold start)
        run: |
          for i in $(seq 1 18); do
            if curl -sf -m 20 "$API_URL/health" > /tmp/health.json; then
              cat /tmp/health.json
              # Healthy means the audit log, alerts, sign-in and packaging model are all live.
              jq -e '.status == "ok" and .audit_log_configured and .alerts_configured and .auth_required and .visual_model_loaded' /tmp/health.json >/dev/null \
                || { echo "::error::Backend is up but misconfigured"; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not become healthy within 3 minutes"; exit 1
      - name: Public barcode parsing
        run: |
          jq -r .body backend/events/parse.json > /tmp/parse.json
          curl -sf -m 30 -H 'Content-Type: application/json' --data-binary @/tmp/parse.json "$API_URL/parse" \
            | jq -e '.valid == true and .gtin == "09506000134352"'
      - name: Writes require sign-in
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json' -d '{"barcode":"x"}' "$API_URL/scan")
          test "$code" = 401 || { echo "::error::/scan without a token returned $code, expected 401"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$API_URL/alerts")
          test "$code" = 401 || { echo "::error::/alerts without a token returned $code, expected 401"; exit 1; }
      - name: Frontend is up
        run: curl -sf -m 30 -o /dev/null "$APP_URL"
      - name: Full clone demo (manual runs with accounts only)
        if: github.event_name == 'workflow_dispatch' && inputs.adama_password != '' && inputs.dessie_password != ''
        env:
          SUPABASE_URL: https://qzhumrpdwqkleilqdmbl.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aHVtcnBkd3FrbGVpbHFkbWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODc3MzcsImV4cCI6MjEwODQ2MzczN30.c7WMDFzD4S2XAGWSuQIgf3NzppWejoxdg-1jqESj-vA
        run: |
          # Read credentials from the event payload so they never appear in
          # the step's printed script or environment listing.
          for key in adama_email adama_password dessie_email dessie_password; do
            value=$(jq -r ".inputs.$key // empty" "$GITHUB_EVENT_PATH")
            case $key in *password) echo "::add-mask::$value";; esac
            export "${key^^}=$value"
          done
          pip install -q httpx==0.28.1
          bash scripts/run-demo.sh
      - name: Inspector alert list (manual runs with the inspector account only)
        if: github.event_name == 'workflow_dispatch' && inputs.inspector_password != ''
        run: |
          password=$(jq -r .inputs.inspector_password "$GITHUB_EVENT_PATH"); echo "::add-mask::$password"
          token=$(jq -n --arg p "$password" '{email:"inspector@medtrace.demo",password:$p}' \
            | curl -sf -m 30 -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d @- \
                "https://qzhumrpdwqkleilqdmbl.supabase.co/auth/v1/token?grant_type=password" | jq -r .access_token)
          echo "::add-mask::$token"
          curl -sf -m 30 -H "Authorization: Bearer $token" "$API_URL/alerts?limit=5" \
            | tee /tmp/alerts.json | jq -e '(.alerts | length) >= 1 and (.alerts[0].flags | length) >= 1' >/dev/null
          jq -c '{count: (.alerts | length), newest: .alerts[0] | {site_id, verdict, codes: [.flags[].code]}, next_before}' /tmp/alerts.json
        env:
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aHVtcnBkd3FrbGVpbHFkbWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODc3MzcsImV4cCI6MjEwODQ2MzczN30.c7WMDFzD4S2XAGWSuQIgf3NzppWejoxdg-1jqESj-vA
