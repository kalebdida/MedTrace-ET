name: Test and deploy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: medtrace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      aws_enabled: ${{ steps.targets.outputs.aws_enabled }}
      hf_enabled: ${{ steps.targets.outputs.hf_enabled }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: targets
        env:
          AWS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "aws_enabled=$([[ -n "$AWS_ROLE" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "hf_enabled=$([[ -n "$HF_TOKEN" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: pip install -r backend/requirements-dev.txt -r backend/requirements-server.txt testcontainers==4.10.0
      - run: cd backend && python -m pytest -q
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/template.yaml --region us-east-1
      - run: pip install cfn-lint==1.58.0 && cfn-lint infra/bootstrap/github-oidc.yaml
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.outputs.aws_enabled == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - working-directory: infra
        run: |
          test -n "$BUDGET_EMAIL"
          sam build
          sam deploy --region "$AWS_REGION" --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "AlertEmail=$ALERT_EMAIL" "BudgetEmail=$BUDGET_EMAIL"
      - name: Public endpoint smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name medtrace-et --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' --output text)
          curl --fail-with-body --retry 5 "$API_URL/health" | jq -e '.status == "ok"'
          jq -r .body backend/events/parse.json > /tmp/parse.json
          curl --fail-with-body --retry 5 -H 'Content-Type: application/json' --data-binary @/tmp/parse.json "$API_URL/parse" | jq -e '.valid == true'
